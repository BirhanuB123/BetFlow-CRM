version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: betflow_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betflowpassword}
      POSTGRES_DB: ${POSTGRES_DB:-betflow_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-betflow} -d ${POSTGRES_DB:-betflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: betflow_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-betflow}:${POSTGRES_PASSWORD:-betflowpassword}@postgres:5432/${POSTGRES_DB:-betflow_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_betflow_prod}
      JWT_EXPIRES_IN: 12h
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      DOCUMENTS_STORAGE_PATH: ./uploads/documents
      AFROMESSAGE_API_KEY: ${AFROMESSAGE_API_KEY:-}
      AFROMESSAGE_SENDER_ID: ${AFROMESSAGE_SENDER_ID:-Gebeta Tech}
      AFROMESSAGE_IDENTIFIER: ${AFROMESSAGE_IDENTIFIER:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    container_name: betflow_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
