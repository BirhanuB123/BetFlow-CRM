version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: betflow_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betflow_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-betflow_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-betflow} -d ${POSTGRES_DB:-betflow_crm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: betflow_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-betflow}:${POSTGRES_PASSWORD:-betflow_secret_pass}@postgres:5432/${POSTGRES_DB:-betflow_crm}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_betflow_prod}
      JWT_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: betflow_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
