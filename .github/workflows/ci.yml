name: BetFlow CRM — CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: |
          cd apps/api
          npx prisma generate

      - name: Monorepo Type-Check & Production Build
        run: npm run build
        env:
          JWT_SECRET: "ci-testing-super-secret-jwt-key-minimum-64-bits"
          DATABASE_URL: "postgresql://betflow:betflowpassword@localhost:5432/betflow_db?schema=public"

      - name: Run Backend Unit & Integration Tests
        run: |
          cd apps/api
          npm run test
